name: Verify application
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: aluminum_backup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ALUMINUM_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/aluminum_backup_test?allowPublicKeyRetrieval=true&sslMode=DISABLED
      ALUMINUM_TEST_DB_USERNAME: root
      ALUMINUM_TEST_DB_PASSWORD: integration-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend tests
        working-directory: backend
        run: bash ./mvnw test
      - name: Restore into isolated MySQL staging
        working-directory: backend
        run: bash ./mvnw '-Dtest=*MysqlIT' test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
      - name: Frontend regressions
        working-directory: frontend
        run: node --test tests/*.test.mjs

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder resource for compile check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path frontend/src-tauri/resources -Force | Out-Null
          New-Item -ItemType File -Path frontend/src-tauri/resources/aluminum-manager.jar -Force | Out-Null
          Copy-Item scripts/start-recovered-backend.ps1 frontend/src-tauri/resources/start-recovered-backend.ps1
      - name: Check desktop Rust code
        working-directory: frontend/src-tauri
        run: cargo check --locked

  windows-build-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Packaging stops on native command failures
        shell: pwsh
        run: ./scripts/test-windows-build.ps1
      - name: Recovery launcher isolation
        shell: pwsh
        run: ./scripts/test-recovered-backend.ps1
