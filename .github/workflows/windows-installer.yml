name: Build Windows installer candidate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    uses: ./.github/workflows/verify.yml

  installer:
    needs: verification
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check native toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain is unavailable' }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'Cargo is unavailable' }
          cargo metadata --locked --no-deps --format-version 1 --manifest-path frontend/src-tauri/Cargo.toml > "$env:RUNNER_TEMP/rust-metadata.json"
          if ($LASTEXITCODE -ne 0) { throw 'Rust lockfile does not match the desktop manifest' }
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build backend, frontend and NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Require NSIS installer output
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'frontend/src-tauri/target/release/bundle/nsis/*.exe' -ErrorAction SilentlyContinue)) {
            throw 'Build produced no Windows installer'
          }
          git diff --exit-code -- frontend/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build unexpectedly changed the verified Rust lockfile' }
      - name: Store installer candidate
        uses: actions/upload-artifact@v4
        with:
          name: aluminum-windows-${{ github.sha }}
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
