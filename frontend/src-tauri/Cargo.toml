[package]
name = "aluminum-manager"
version = "0.1.0"
description = "Quan ly hang hoa nhom"
authors = ["aluminum-manager"]
edition = "2021"

[lib]
name = "aluminum_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
